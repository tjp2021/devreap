{
  "schema_version": 1,
  "plan_id": "attribution-engine",
  "title": "Session attribution and process lifecycle engine for devreap",
  "owner": "devreap maintainer",
  "project_root": ".",
  "risk": {
    "tier": 2,
    "triggers": [
      "automation",
      "persistent_data",
      "multi_component",
      "production_behavior"
    ],
    "rationale": "A continuous watcher runs inside a user LaunchAgent daemon, records spawn links and ownership for every observed process birth, writes a durable local store, and feeds a state machine that later gates a process-killing path. Recurring automation, persistent data, and multi-component coupling set the minimum at Tier 2. Tier 3 does not apply in phase A because the design adds no kill authority, no credential handling, no network interface, and no external side effect."
  },
  "lifecycle": {
    "state": "DESIGN",
    "scope_fingerprint": null,
    "validated_at": null
  },
  "scope": {
    "in": [
      "A watcher loop that polls the process table each second and records a birth record and a spawn link for every process it observes appear.",
      "Ownership resolution led by watched ancestry, which yields observed confidence for any harness without vendor cooperation, with environment markers and process group demoted to corroboration and to backfill for processes born before the watcher started.",
      "A harness adapter registry loaded from a data file, covering terminal harnesses, editor-extension-hosted harnesses, application-bundle desktop harnesses, and a compiled-in generic descriptor that labels unrecognized roots as unknown-harness.",
      "Owner exit detection through kqueue EVFILT_PROC NOTE_EXIT watches on identified session roots, with poll absence as the fallback source.",
      "A durable append-only journal with periodic snapshots, an in-memory index, retention limits, and a hard size ceiling.",
      "A per-process lifecycle state machine with per-class lifecycle_grace windows measured as awake-time accumulators that pause across sleep, multi-scan confirmation, and a recovery path back to ACTIVE from every state except EXITED and RECLAIMED.",
      "A KERN_PROCARGS2 process-arguments reader, because gopsutil v4.26.1 returns ErrNotImplementedError for Environ on darwin, plus a KERN_PROC_ALL bulk snapshot supplying parent, group, terminal, and start time in one call.",
      "A redaction filter built from scratch, since no redaction facility exists in the codebase, sitting between every foreign-process read and every consumer.",
      "Claim upgrade records that raise a claim from inferred to observed when a spawn link becomes provable, leaving the immutable birth record untouched.",
      "Evidence export through devreap top --json and devreap evidence <session>, emitting the spawn tree, timings, owner exit, and transition history for one session.",
      "A read-only devreap top surface showing per-session process trees, resident memory totals, per-process state, and time since owner exit.",
      "Coverage and watcher health reporting through devreap status and devreap doctor.",
      "Phase B attribution gating that can only subtract kill eligibility, behind a separate explicit opt-in key."
    ],
    "out": [
      "The existing pattern matcher, weighted scorer, strong-signal gate, and observe-only default stay exactly as they are today.",
      "No new signal that argues for termination is added, and attribution may never widen the set of kill-eligible processes.",
      "No attribution feature may depend on one vendor's cooperation, environment variable, or hook; devreap stays harness-neutral and vendor markers remain enrichment only.",
      "A harness missing from the adapter data file still receives full observed attribution through watched ancestry, so recognition gaps never become attribution gaps.",
      "The existing grace_period configuration key keeps its current meaning as the wait between SIGTERM and escalation, and the new per-class window takes the distinct name lifecycle_grace so neither key is renamed.",
      "Linux and Windows support stays out of this plan, as does cache reclamation and cross-machine correlation.",
      "No system extension, no Apple entitlement, no elevated privilege, no network listener, and no telemetry are introduced.",
      "No automatic action is ever taken against a process whose owner cannot be established."
    ],
    "implementation_paths": [
      "internal/attribution/procargs_darwin.go",
      "internal/attribution/redact.go",
      "internal/attribution/harness.go",
      "internal/attribution/harnesses.yaml",
      "internal/attribution/ownership.go",
      "internal/attribution/store.go",
      "internal/attribution/lifecycle.go",
      "internal/attribution/watcher.go",
      "internal/cli/top.go",
      "internal/cli/evidence.go",
      "internal/cli/status.go",
      "internal/cli/doctor.go",
      "internal/config/config.go",
      "internal/config/defaults.go",
      "internal/daemon/daemon.go",
      "internal/scanner/scanner.go",
      "docs/attribution.md"
    ],
    "dependencies": [
      "github.com/shirou/gopsutil/v4 process enumeration already in use, excluding Environ which returns ErrNotImplementedError on darwin at process/process_bsd.go lines 63 to 65",
      "macOS sysctl KERN_PROC_ALL returning kinfo_proc for the per-poll bulk snapshot",
      "macOS sysctl KERN_PROCARGS2 for per-process argument and environment reads, parsed by internal/attribution/procargs_darwin.go",
      "macOS kqueue EVFILT_PROC NOTE_EXIT for session root exit events",
      "existing internal/patterns class registry as the model for the adapter data file",
      "no reuse of internal/logger rotation; the store carries its own rotation at mode 0600"
    ],
    "data": [
      "birth records keyed by PID and start time, holding parent key, process group, terminal, class, harness label, link depth, and ownership claim",
      "spawn links recorded at birth, mapping a child key to its parent key, forming the chain that reaches a session root",
      "harness adapter descriptors holding root recognition rules, parent kind, optional marker names, repo source, and a verification status of verified-live, doc-sourced, or unverified",
      "owner exit events holding session id, leader key, source, member count, and resident memory at exit",
      "lifecycle transition records holding from state, to state, trigger, evidence, confirmation counter, and accumulated awake milliseconds, which is what makes windows survive a restart",
      "claim upgrade records raising inferred to observed, written alongside the immutable birth record rather than editing it",
      "watcher heartbeat records written every 60 seconds holding aggregated counters, poll duration, sleep gap milliseconds, tracked count, attributed count, upgraded count, and journal size",
      "allowlisted environment values limited to session id, project directory, and agent name",
      "retention of 7 days for exited processes with a 32 megabyte hard ceiling enforced by rotation, against a measured budget of about 3 megabytes a day and about 21 megabytes across the window"
    ],
    "trust_boundaries": [
      "single user account on one machine; every observed process belongs to that same account",
      "process environment values and command lines are untrusted input that any local process can forge; a forged marker caps at inferred confidence and cannot manufacture a spawn link",
      "the harness adapter data file is user-writable configuration, never authority; the true bound is that attribution can never exceed the phase A eligible set, while a wrong entry can still cause a wrong kill inside that set, which is why the registry rejects roots naming shells, terminal emulators, multiplexers, launchd, process 1, blocklisted binaries, nesting roots, and non-discriminating rules, and bounds link depth at 32",
      "the KERN_PROCARGS2 reader touches foreign process memory and sits on the secret-redaction path; it runs same-user only, bounds every parsed length, treats the packed buffer as untrusted input, errors rather than returning partial results, and never returns a value that has not passed the redaction filter",
      "the store is a user-writable file and is never an authority for an action",
      "phase B keeps live identity re-verification immediately before signalling, with attribution as an additional check"
    ],
    "external_interfaces": [
      "optional agent-side session-end hook accepted as enrichment only, never as a dependency",
      "local CLI surfaces top, scan, status, and doctor",
      "no network interface of any kind"
    ],
    "authorities": [
      "maintainer authorizes each phase separately; phase A approval does not carry to phase B",
      "the user must set the phase B opt-in key by hand; no install or upgrade may set it",
      "the built-in blocklist and the same-user restriction stay in force under every code path"
    ]
  },
  "implementation": {
    "sequence": [
      "Add the redaction filter with the variable-name allowlist and token-shaped argument masking, plus its tests, before anything reads a foreign process.",
      "Add the KERN_PROCARGS2 process-arguments reader and the KERN_PROC_ALL bulk snapshot, with bounded parsing, clean errors on truncated buffers, and results handed straight to the redaction filter.",
      "Add the harness adapter registry: descriptor type, data file loader with built-in entries plus user extras, load-time validation with its rejection rules, compiled-in generic descriptor, and recognition tests for the four verified harness shapes.",
      "Add ownership resolution as a pure function over process fields and a spawn-link index, with the observed, inferred, and none confidence ladder, claim upgrades, and the link depth bound, and unit tests.",
      "Add the store package with record types, append, torn-tail recovery, snapshot, its own rotation at mode 0600, retention, recovery disagreement rules, and schema version handling.",
      "Add the lifecycle engine as a pure state machine over injected events and an injected clock, with the full transition table, awake-time accumulators, and the sleep and restart tests.",
      "Add the watcher loop behind a configuration key that defaults off, writing births, spawn links, and 60 second heartbeats only, with panic isolation and no consumer wired in.",
      "Add owner exit watches through kqueue NOTE_EXIT on session roots, with poll absence as the fallback source.",
      "Wire the lifecycle engine to scan results with no effect on eligibility, and add coverage reporting to status and doctor.",
      "Add devreap top as a read-only table view over the store, including --json output.",
      "Add devreap evidence <session> export emitting the spawn tree, timings, owner exit, and transition history as one JSON document.",
      "Turn phase A on by default in observe-only form and document it in the README.",
      "Add phase B attribution gating behind a separate opt-in key, with the subset test gating the change."
    ],
    "commit_boundaries": [
