patterns:
  - name: node-mcp-server
    category: mcp
    command: "^node$"
    args: "((^|[^0-9A-Za-z])mcp([^0-9A-Za-z]|$)|model[-_.]context|modelcontextprotocol)"
    max_duration: 4h
    signal: sigterm
    grace_period: 5s
    description: "Node.js MCP server processes"

  - name: python-mcp-server
    category: mcp
    command: "^python[0-9.]*$"
    args: "((^|[^0-9A-Za-z])mcp([^0-9A-Za-z]|$)|model[-_.]context|modelcontextprotocol)"
    max_duration: 4h
    signal: sigterm
    grace_period: 5s
    description: "Python MCP server processes"

  - name: npx-mcp-server
    category: mcp
    command: "^npx$"
    args: "((^|[^0-9A-Za-z])mcp([^0-9A-Za-z]|$)|modelcontextprotocol)"
    max_duration: 4h
    signal: sigterm
    grace_period: 5s
    description: "npx-launched MCP server processes"

  - name: uvx-mcp-server
    category: mcp
    command: "^uvx$"
    args: "((^|[^0-9A-Za-z])mcp([^0-9A-Za-z]|$)|model[-_.]context)"
    max_duration: 4h
    signal: sigterm
    grace_period: 5s
    description: "uvx-launched MCP server processes"

  - name: docker-mcp-server
    category: mcp
    command: "^docker$"
    args: "run.*((^|[^0-9A-Za-z])mcp([^0-9A-Za-z]|$)|modelcontextprotocol)"
    max_duration: 4h
    signal: sigterm
    grace_period: 10s
    description: "Docker-based MCP server processes"
